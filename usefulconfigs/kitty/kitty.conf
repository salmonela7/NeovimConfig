# Kitty Configuration
# Font Configuration
font_family      CaskaydiaCove Nerd Font Mono DemiBold
bold_font        CaskaydiaCove Nerd Font Mono Bold
italic_font      CaskaydiaCove Nerd Font Mono DemiBold Italic
bold_italic_font CaskaydiaCove Nerd Font Mono Bold Italic
font_size        12.0

# Remap Cmd to act as Ctrl for all keys

# macOS specific: use Cmd instead of Ctrl
# This makes Cmd+C, Cmd+V, etc. work as Ctrl+C, Ctrl+V in terminal
macos_option_as_alt yes

# Disable confirmation prompt when closing kitty
confirm_os_window_close 0

# Map Cmd+key to send Ctrl+key for common keys
# Copy/Paste
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Common terminal shortcuts
map cmd+t new_tab
map cmd+w close_tab
map cmd+n new_os_window

# Send Ctrl sequences for Cmd keys (generic approach)
# This allows Cmd+[key] to send Ctrl+[key] to terminal applications
map cmd+a send_text all \x01
map cmd+b send_text all \x02
map cmd+d send_text all \x04
map cmd+e send_text all \x05
map cmd+f send_text all \x06
map cmd+g send_text all \x07
map cmd+h send_text all \x08
map cmd+i send_text all \x09
map cmd+j send_text all \x0a
map cmd+k send_text all \x0b
map cmd+l send_text all \x0c
map cmd+n send_text all \x0e
map cmd+o send_text all \x0f
map cmd+p send_text all \x10
map cmd+q send_text all \x11
map cmd+r send_text all \x12
map cmd+s send_text all \x13
map cmd+u send_text all \x15
map cmd+w send_text all \x17
map cmd+x send_text all \x18
map cmd+y send_text all \x19
map cmd+z send_text all \x1a
map cmd+slash send_text all \x1F
# Note: Some Cmd+key combinations are reserved by macOS
# Cmd+Tab, Cmd+Space, Cmd+Q (quit) may need system-level remapping

map cmd+left send_text all \x1b\x62
map cmd+right send_text all \x1b\x66
map cmd+backspace send_text all \x17

# Unbind cmd+enter (disable it)
map cmd+enter no_op

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME
